<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information Form - Taib</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .form-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .form-header p {
            font-size: 1rem;
            opacity: 0.95;
        }

        .form-content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.3rem;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .required::after {
            content: " *";
            color: #ff6b6b;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="url"],
        textarea,
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="url"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .add-more-btn {
            background: #f0f0f0;
            border: 2px dashed #667eea;
            color: #667eea;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .add-more-btn:hover {
            background: #667eea;
            color: white;
        }

        .skill-tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .skill-tag {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        button[type="submit"],
        button[type="button"] {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button[type="button"] {
            background: #f0f0f0;
            color: #333;
        }

        button[type="button"]:hover {
            background: #e0e0e0;
        }

        .hidden {
            display: none;
        }

        .form-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .form-item-header h4 {
            color: #667eea;
            font-size: 0.95rem;
        }

        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .remove-btn:hover {
            background: #ff5252;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .form-header h1 {
                font-size: 1.5rem;
            }

            .form-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-header">
            <h1>📋 My Personal Information</h1>
            <p>Fill in your details to create your professional portfolio</p>
        </div>

        <div class="form-content">
            <form id="personalForm">

                <!-- PERSONAL INFORMATION -->
                <div class="section">
                    <div class="section-title">👤 Personal Information</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fullName" class="required">Full Name</label>
                            <input type="text" id="fullName" placeholder="e.g., Md Abu Taib" required>
                        </div>
                        <div class="form-group">
                            <label for="headline">Professional Headline</label>
                            <input type="text" id="headline" placeholder="e.g., Web Developer | Student">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="location">Location</label>
                            <input type="text" id="location" placeholder="e.g., Dhaka, Bangladesh">
                        </div>
                        <div class="form-group">
                            <label for="email" class="required">Email Address</label>
                            <input type="email" id="email" placeholder="your.email@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+880 1XX XXX XXXX">
                    </div>
                </div>

                <!-- ABOUT ME -->
                <div class="section">
                    <div class="section-title">✍️ About You</div>

                    <div class="form-group">
                        <label for="about" class="required">Bio / About Me</label>
                        <textarea id="about" placeholder="Write 2-3 sentences about yourself. What are your interests and goals?" required></textarea>
                    </div>
                </div>

                <!-- WORK EXPERIENCE -->
                <div class="section">
                    <div class="section-title">💼 Work Experience</div>
                    <div id="experienceContainer"></div>
                    <button type="button" class="add-more-btn" onclick="addExperience()">+ Add Experience</button>
                </div>

                <!-- EDUCATION -->
                <div class="section">
                    <div class="section-title">🎓 Education</div>
                    <div id="educationContainer"></div>
                    <button type="button" class="add-more-btn" onclick="addEducation()">+ Add Education</button>
                </div>

                <!-- SKILLS -->
                <div class="section">
                    <div class="section-title">🛠️ Skills</div>

                    <div class="form-group">
                        <label for="skillInput">Add Your Skills</label>
                        <input type="text" id="skillInput" placeholder="e.g., JavaScript" onkeypress="if(event.key==='Enter') addSkill()">
                        <button type="button" class="add-more-btn" onclick="addSkill()" style="margin-top: 10px;">Add Skill</button>
                    </div>
                    <div class="skill-tag-container" id="skillsContainer"></div>
                </div>

                <!-- PROJECTS -->
                <div class="section">
                    <div class="section-title">📁 Projects</div>
                    <div id="projectsContainer"></div>
                    <button type="button" class="add-more-btn" onclick="addProject()">+ Add Project</button>
                </div>

                <!-- SOCIAL LINKS -->
                <div class="section">
                    <div class="section-title">🔗 Social Links & Contact</div>

                    <div class="form-group">
                        <label for="github">GitHub Profile</label>
                        <input type="url" id="github" placeholder="https://github.com/yourusername">
                    </div>

                    <div class="form-group">
                        <label for="linkedin">LinkedIn Profile</label>
                        <input type="url" id="linkedin" placeholder="https://linkedin.com/in/yourprofile">
                    </div>

                    <div class="form-group">
                        <label for="twitter">Twitter/X (Optional)</label>
                        <input type="url" id="twitter" placeholder="https://twitter.com/yourhandle">
                    </div>

                    <div class="form-group">
                        <label for="portfolio">Portfolio Website (Optional)</label>
                        <input type="url" id="portfolio" placeholder="https://yourportfolio.com">
                    </div>
                </div>

                <!-- CERTIFICATIONS -->
                <div class="section">
                    <div class="section-title">🏆 Certifications & Achievements</div>
                    <div id="certificationsContainer"></div>
                    <button type="button" class="add-more-btn" onclick="addCertification()">+ Add Certification</button>
                </div>

                <!-- BUTTONS -->
                <div class="button-group">
                    <button type="button" onclick="clearForm()">Clear All</button>
                    <button type="submit">Generate My Information</button>
                </div>
            </form>

            <!-- OUTPUT -->
            <div id="outputSection" class="hidden" style="margin-top: 40px;">
                <div style="background: #f5f5f5; padding: 20px; border-radius: 8px;">
                    <h3 style="margin-bottom: 15px; color: #333;">📋 Your Information (Copy this text):</h3>
                    <textarea id="outputText" readonly style="width: 100%; height: 300px; padding: 15px; border-radius: 8px; border: 1px solid #ddd; font-family: monospace; font-size: 0.9rem;"></textarea>
                    <button type="button" onclick="copyToClipboard()" style="background: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: 600;">📋 Copy to Clipboard</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let experienceCount = 0;
        let educationCount = 0;
        let projectCount = 0;
        let certificationCount = 0;
        let skills = [];

        function addExperience() {
            experienceCount++;
            const html = `
                <div style="margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px;">
                    <div class="form-item-header">
                        <h4>Experience ${experienceCount}</h4>
                        <button type="button" class="remove-btn" onclick="this.closest('div').remove()">Remove</button>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Job Title</label>
                            <input type="text" class="exp-title" placeholder="e.g., Full Stack Developer">
                        </div>
                        <div class="form-group">
                            <label>Company Name</label>
                            <input type="text" class="exp-company" placeholder="e.g., Tech Company">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Duration</label>
                            <input type="text" class="exp-duration" placeholder="e.g., Jan 2024 - Present">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea class="exp-description" placeholder="Describe your role and responsibilities"></textarea>
                    </div>
                </div>
            `;
            document.getElementById('experienceContainer').insertAdjacentHTML('beforeend', html);
        }

        function addEducation() {
            educationCount++;
            const html = `
                <div style="margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px;">
                    <div class="form-item-header">
                        <h4>Education ${educationCount}</h4>
                        <button type="button" class="remove-btn" onclick="this.closest('div').remove()">Remove</button>
                    </div>
                    <div class="form-group">
                        <label>School/University Name</label>
                        <input type="text" class="edu-school" placeholder="e.g., Bangladesh University of Engineering and Technology">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Degree</label>
                            <input type="text" class="edu-degree" placeholder="e.g., Bachelor of Science">
                        </div>
                        <div class="form-group">
                            <label>Field of Study</label>
                            <input type="text" class="edu-field" placeholder="e.g., Computer Science">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Year of Graduation</label>
                        <input type="text" class="edu-year" placeholder="e.g., 2025">
                    </div>
                </div>
            `;
            document.getElementById('educationContainer').insertAdjacentHTML('beforeend', html);
        }

        function addProject() {
            projectCount++;
            const html = `
                <div style="margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px;">
                    <div class="form-item-header">
                        <h4>Project ${projectCount}</h4>
                        <button type="button" class="remove-btn" onclick="this.closest('div').remove()">Remove</button>
                    </div>
                    <div class="form-group">
                        <label>Project Name</label>
                        <input type="text" class="proj-name" placeholder="e.g., Personal Portfolio Website">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea class="proj-description" placeholder="What does your project do?"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Technologies Used</label>
                        <input type="text" class="proj-tech" placeholder="e.g., HTML, CSS, JavaScript, React">
                    </div>
                    <div class="form-group">
                        <label>Project Link</label>
                        <input type="url" class="proj-link" placeholder="https://github.com/username/project">
                    </div>
                </div>
            `;
            document.getElementById('projectsContainer').insertAdjacentHTML('beforeend', html);
        }

        function addCertification() {
            certificationCount++;
            const html = `
                <div style="margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px;">
                    <div class="form-item-header">
                        <h4>Certification ${certificationCount}</h4>
                        <button type="button" class="remove-btn" onclick="this.closest('div').remove()">Remove</button>
                    </div>
                    <div class="form-group">
                        <label>Certification Name</label>
                        <input type="text" class="cert-name" placeholder="e.g., Google Cloud Associate Cloud Engineer">
                    </div>
                    <div class="form-group">
                        <label>Issuer (Optional)</label>
                        <input type="text" class="cert-issuer" placeholder="e.g., Google">
                    </div>
                </div>
            `;
            document.getElementById('certificationsContainer').insertAdjacentHTML('beforeend', html);
        }

        function addSkill() {
            const skillInput = document.getElementById('skillInput');
            const skill = skillInput.value.trim();
            
            if (skill && !skills.includes(skill)) {
                skills.push(skill);
                skillInput.value = '';
                renderSkills();
            }
        }

        function removeSkill(skill) {
            skills = skills.filter(s => s !== skill);
            renderSkills();
        }

        function renderSkills() {
            const container = document.getElementById('skillsContainer');
            container.innerHTML = skills.map(skill => `
                <div class="skill-tag">
                    ${skill}
                    <button type="button" onclick="removeSkill('${skill}')">✕</button>
                </div>
            `).join('');
        }

        document.getElementById('personalForm').addEventListener('submit', function(e) {
            e.preventDefault();
            generateOutput();
        });

        function generateOutput() {
            let output = '=== MY PERSONAL INFORMATION ===\n\n';

            output += '👤 PERSONAL INFORMATION\n';
            output += `Full Name: ${document.getElementById('fullName').value}\n`;
            output += `Professional Headline: ${document.getElementById('headline').value}\n`;
            output += `Location: ${document.getElementById('location').value}\n`;
            output += `Email: ${document.getElementById('email').value}\n`;
            output += `Phone: ${document.getElementById('phone').value}\n\n`;

            output += '✍️ ABOUT ME\n';
            output += `${document.getElementById('about').value}\n\n`;

            output += '💼 WORK EXPERIENCE\n';
            document.querySelectorAll('.exp-title').forEach((el, idx) => {
                if (el.value) {
                    output += `\nExperience ${idx + 1}:\n`;
                    output += `  Job Title: ${el.value}\n`;
                    output += `  Company: ${el.parentElement.parentElement.querySelector('.exp-company').value}\n`;
                    output += `  Duration: ${el.parentElement.parentElement.querySelector('.exp-duration').value}\n`;
                    output += `  Description: ${el.parentElement.parentElement.querySelector('.exp-description').value}\n`;
                }
            });
            output += '\n';

            output += '🎓 EDUCATION\n';
            document.querySelectorAll('.edu-school').forEach((el, idx) => {
                if (el.value) {
                    output += `\nEducation ${idx + 1}:\n`;
                    output += `  School: ${el.value}\n`;
                    output += `  Degree: ${el.parentElement.parentElement.querySelector('.edu-degree').value}\n`;
                    output += `  Field: ${el.parentElement.parentElement.querySelector('.edu-field').value}\n`;
                    output += `  Year: ${el.parentElement.parentElement.querySelector('.edu-year').value}\n`;
                }
            });
            output += '\n';

            output += '🛠️ SKILLS\n';
            output += skills.join(', ') + '\n\n';

            output += '📁 PROJECTS\n';
            document.querySelectorAll('.proj-name').forEach((el, idx) => {
                if (el.value) {
                    output += `\nProject ${idx + 1}:\n`;
                    output += `  Name: ${el.value}\n`;
                    output += `  Description: ${el.parentElement.parentElement.querySelector('.proj-description').value}\n`;
                    output += `  Technologies: ${el.parentElement.parentElement.querySelector('.proj-tech').value}\n`;
                    output += `  Link: ${el.parentElement.parentElement.querySelector('.proj-link').value}\n`;
                }
            });
            output += '\n';

            output += '🔗 SOCIAL LINKS\n';
            output += `GitHub: ${document.getElementById('github').value}\n`;
            output += `LinkedIn: ${document.getElementById('linkedin').value}\n`;
            output += `Twitter: ${document.getElementById('twitter').value}\n`;
            output += `Portfolio: ${document.getElementById('portfolio').value}\n\n`;

            output += '🏆 CERTIFICATIONS\n';
            document.querySelectorAll('.cert-name').forEach((el, idx) => {
                if (el.value) {
                    output += `\nCertification ${idx + 1}:\n`;
                    output += `  Name: ${el.value}\n`;
                    output += `  Issuer: ${el.parentElement.parentElement.querySelector('.cert-issuer').value}\n`;
                }
            });

            document.getElementById('outputText').value = output;
            document.getElementById('outputSection').classList.remove('hidden');
            document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
        }

        function copyToClipboard() {
            const outputText = document.getElementById('outputText');
            outputText.select();
            document.execCommand('copy');
            alert('✅ Copied to clipboard! Send this to me now.');
        }

        function clearForm() {
            if (confirm('Are you sure you want to clear all information?')) {
                document.getElementById('personalForm').reset();
                skills = [];
                renderSkills();
                document.getElementById('experienceContainer').innerHTML = '';
                document.getElementById('educationContainer').innerHTML = '';
                document.getElementById('projectsContainer').innerHTML = '';
                document.getElementById('certificationsContainer').innerHTML = '';
                document.getElementById('outputSection').classList.add('hidden');
                experienceCount = 0;
                educationCount = 0;
                projectCount = 0;
                certificationCount = 0;
            }
        }
    </script>
</body>
</html>
